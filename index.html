// パチンコ大当たり演出：キュイン!→父ズバン!→けんズバン!→金色回転で親子丼波ドーン
function playCutin(done) {
  var layer = document.getElementById('cutin-layer');
  var flash = document.getElementById('cutin-flash');
  var rays = document.getElementById('cutin-rays');
  var bandF = document.getElementById('cutin-band-father');
  var bandK = document.getElementById('cutin-band-ken');
  var img = document.getElementById('cutin-img');
  var title = document.getElementById('cutin-title');
  // プレミア演出：3回に1回、リアル画像版の親子丼波（激アツ枠）
  var premium = Math.random() < 1 / 3;
  img.src = ART + (premium ? 'cutin_oyakodonpa_premium.jpg' : 'cutin_oyakodonpa.jpg');
  // 初期化
  layer.classList.remove('gone');
  rays.classList.remove('on');
  bandF.className = 'cutin-band';
  bandK.className = 'cutin-band';
  bandF.style.opacity = ''; bandK.style.opacity = '';
  img.classList.add('gone');
  title.classList.add('gone');
  // 第1段: キュイン!キュイン! + 白フラッシュ連打
  sfxKyuin();
  flash.classList.remove('blink'); void flash.offsetWidth; flash.classList.add('blink');
  // 第2段: 父の顔カットイン、左からズバン!
  setTimeout(function() {
    bandF.classList.add('slam-left');
    sfxSlam();
    triggerScreenShake(false);
  }, 650);
  // 第3段: けんの顔カットイン、右からズバン!
  setTimeout(function() {
    bandK.classList.add('slam-right');
    sfxSlam();
    triggerScreenShake(false);
  }, 1200);
  // 第4段: 大当たり!! 金色の放射光が回転、本命カットインと技名がドーン
  setTimeout(function() {
    bandF.classList.add('out');
    bandK.classList.add('out');
    rays.classList.add('on');
    img.classList.remove('gone');
    img.style.animation = 'none'; void img.offsetWidth; img.style.animation = '';
    // プレミアは画像に金文字が焼き込まれているので、下のピンク文字は出さない
    if (!premium) title.classList.remove('gone');
    sfxHissatsu();
    triggerScreenShake(true);
    triggerScreenFlash('rgba(255,215,80,0.95)');
    spawnConfetti(100, '#ffd54f');
    if (premium) {
      // 激アツ：白フラッシュ＋青銀の紙吹雪を追加
      setTimeout(function() { triggerScreenFlash('rgba(255,255,255,0.95)'); }, 250);
      spawnConfetti(80, '#81d4fa');
    }
  }, 1850);
  setTimeout(function() { spawnConfetti(60, '#ff6b9d'); }, 2600);
  setTimeout(function() { spawnConfetti(60, '#ffd54f'); }, 3300);
  // 終了
  setTimeout(function() {
    layer.classList.add('gone');
    rays.classList.remove('on');
    if (done) done();
  }, 4800);
}
// パチンコの「キュイン!」
function sfxKyuin() {
  var ac = getAudioCtx(); var t = ac.currentTime;
  for (var i = 0; i < 2; i++) {
    var osc = ac.createOscillator(); var g = ac.createGain();
    osc.type = 'square';
    var st = t + i * 0.3;
    osc.frequency.setValueAtTime(700, st);
    osc.frequency.exponentialRampToValueAtTime(2400, st + 0.22);
    g.gain.setValueAtTime(0.18, st);
    g.gain.linearRampToValueAtTime(0, st + 0.26);
    osc.connect(g); g.connect(sfxGain);
    osc.start(st); osc.stop(st + 0.28);
  }
}
// カットインの「ズバン!」
function sfxSlam() {
  var ac = getAudioCtx(); var t = ac.currentTime;
  var osc = ac.createOscillator(); var g = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(90, t);
  osc.frequency.exponentialRampToValueAtTime(35, t + 0.22);
  g.gain.setValueAtTime(0.4, t);
  g.gain.linearRampToValueAtTime(0, t + 0.3);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t); osc.stop(t + 0.32);
}
function kohakuEffect() {
  // 琥珀たまご：盤面の一番下の段が1段消える
  for (var r = ROWS - 1; r >= 0; r--) {

function startStory() {
  MODE = 'story';
  resetPureRun(true); // 最初から通した走りだけが真エンディングの対象
  document.getElementById('overlay').classList.add('hidden');
  showCards(SC_OPENING, function() {
    beginStoryPhase('play1');
  });
}
function continueStory() {
  MODE = 'story';
  resetPureRun(false); // 「続きから」は対象外
  document.getElementById('overlay').classList.add('hidden');
  beginStoryPhase(localStorage.getItem(STORY_CP_KEY) || 'play1');
}
function beginStoryPhase(phase) {
  MODE = 'story';
  storyPhase = phase;
  localStorage.setItem(STORY_CP_KEY, phase);
  omenShown = phase !== 'play1';
  finisherCounter = 0;
  boss = null;
  hideBossBar();
  resetCore();
  document.getElementById('story-bgimg').classList.remove('gone');
  if (phase === 'boss1') setupBoss('boss1');
  else if (phase === 'boss2') setupBoss('boss2');
  else if (phase === 'finisher') { setupBoss('boss2'); boss.hp = FINISHER_HP; enterFinisher(true); }
  runGame();
  if (phase === 'play1') showDogBubble('父ちゃん、待ってろよ…！', '#ff6b9d');
}
function showTitle(subMsg) {
  gameStarted = false;
  gameOver = false;
  MODE = 'endless';
  storyPhase = null;
  boss = null;
  hideBossBar();
  stopBGM();
  stopStoryBgm();
  stopIdleLoop();
  document.getElementById('story-bgimg').classList.add('gone');
  document.getElementById('title-art').classList.remove('gone');
  document.getElementById('overlay-dog').classList.add('gone');
  document.getElementById('pure-chip').classList.add('gone');

// タイトルの真エンディング案内（初回クリアで解禁、到達後は勲章表示）
function refreshTrueHint() {
  var el = document.getElementById('true-hint');
  if (!el) return;
  var cleared = localStorage.getItem('menyaKenStoryClear') === '1';
  var trueEnd = localStorage.getItem('menyaKenTrueEnd') === '1';
  // クリア済みの人は操作をもう知っているので、説明ボックスをヒントに置き換える
  // （タイトルが縦に伸びて下のボタンが画面外に落ちるのを防ぐ意味もある）
  var tut = document.getElementById('tutorial');
  if (tut) tut.classList.toggle('gone', cleared || trueEnd);
  if (trueEnd) {
    el.textContent = '🏅 真エンディング到達済み — 一度も楽をしなかった証';
    el.classList.remove('gone');
  } else if (cleared) {
    el.textContent = '？ 必殺も、ストックも、替え玉も使わずに\n最初からクリアすると……?';
    el.style.whiteSpace = 'pre-line';
    el.classList.remove('gone');
  } else {
    el.classList.add('gone');
  }
}

function refreshOverlayButtons(state) {
  refreshTrueHint();
  var storyBtn = document.getElementById('story-btn');
  var contBtn = document.getElementById('continue-btn');
  var mainBtn = document.getElementById('overlay-btn');
  var btn2 = document.getElementById('overlay-btn2');
  var cp = localStorage.getItem(STORY_CP_KEY);
  if (state === 'story-over') {
    storyBtn.classList.add('gone');
    contBtn.classList.add('gone');
    mainBtn.textContent = '🍜 替え玉する!（もう一杯）';
    btn2.classList.remove('gone');
    overlayMainMode = 'kaedama';
  } else {
    storyBtn.classList.remove('gone');
    if (cp && cp !== 'play1') contBtn.classList.remove('gone');
    else contBtn.classList.add('gone');
    mainBtn.textContent = (state === 'endless-over') ? 'もう一杯!（エンドレス）' : 'いただきます!（エンドレス）';
    btn2.classList.add('gone');
    overlayMainMode = 'endless';
  }
}
function overlayMain() {

}
