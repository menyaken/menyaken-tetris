<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麺やけん テトリス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:
    radial-gradient(circle at 20% 10%, #ffe3f0 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, #ffd9b8 0%, transparent 50%),
    linear-gradient(160deg, #fff3e6 0%, #ffd9e8 50%, #ffe4cc 100%);
  color: #5c3317;
  font-family: "M PLUS Rounded 1c","Hiragino Maru Gothic Pro","Meiryo",sans-serif;
  font-weight: 700;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}

/* Moving pattern behind everything */
body::before {
  content: ""; position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 15% 25%, rgba(255,107,157,0.18) 2px, transparent 3px),
    radial-gradient(circle at 75% 60%, rgba(255,179,102,0.18) 2px, transparent 3px),
    radial-gradient(circle at 40% 85%, rgba(139,69,19,0.13) 2px, transparent 3px),
    radial-gradient(circle at 90% 15%, rgba(255,107,157,0.15) 2px, transparent 3px);
  background-size: 120px 120px, 140px 140px, 100px 100px, 160px 160px;
  animation: patternDrift 30s linear infinite;
  pointer-events: none; z-index: 0;
}
@keyframes patternDrift {
  from { background-position: 0 0, 0 0, 0 0, 0 0; }
  to   { background-position: 120px 120px, -140px 140px, 100px -100px, -160px 160px; }
}

.game-container {
  position: relative; z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
}

/* ===== HEADER ===== */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px 2px;
  width: 100%;
  flex-shrink: 0;
}
.brand {
  display: flex; align-items: center; gap: 6px;
}
.brand-logo {
  width: 32px; height: 32px; border-radius: 50%;
  border: 3px solid #ff6b9d;
  box-shadow: 0 2px 0 #c44678, 0 4px 10px rgba(255,107,157,0.35);
  background: #fff;
}
.brand-name {
  font-size: 15px; font-weight: 900;
  background: linear-gradient(135deg, #ff6b9d 0%, #c44678 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.04em;
}
.header-btns { display: flex; gap: 6px; }
#bgm-btn, #pause-btn {
  background: #fff;
  color: #ff6b9d;
  border: 3px solid #ff6b9d;
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 3px 0 #c44678;
  font-family: inherit;
  transition: transform 0.08s, box-shadow 0.08s;
}
#bgm-btn:active, #pause-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c44678; }
#bgm-btn.on { background: #ff6b9d; color: #fff; }
#pause-btn.paused { background: #ff6b9d; color: #fff; }
#pause-btn { min-width: 36px; padding: 4px 10px; font-size: 14px; }

/* ===== SCORE ROW (big numbers) ===== */
.score-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 4px 8px;
  width: 100%;
  max-width: 460px;
  flex-shrink: 0;
}
.score-cell {
  background: #fff;
  border: 3px solid #8b4513;
  border-radius: 14px;
  padding: 2px 4px 4px;
  text-align: center;
  box-shadow: 0 3px 0 #5c3317;
  position: relative;
  overflow: hidden;
}
.score-cell .s-label {
  font-size: 9px;
  color: #8b4513;
  font-weight: 800;
  letter-spacing: 0.08em;
  line-height: 1.2;
}
.score-cell .s-val {
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  color: #5c3317;
}
.score-cell.pink { border-color: #ff6b9d; box-shadow: 0 3px 0 #c44678; }
.score-cell.pink .s-label { color: #ff6b9d; }
.score-cell.pink .s-val { color: #c44678; }

/* Score pop animation */
.score-cell.pop .s-val { animation: scorePop 0.35s ease-out; }
@keyframes scorePop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.35); color: #ff3366; }
  100% { transform: scale(1); }
}

/* ===== MAIN PLAY AREA ===== */
.play-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 0;
  width: 100%;
  padding: 4px 8px;
  position: relative;
  overflow: hidden; /* サイドパネルがバトルステージへはみ出すのを防ぐ */
}
@media (max-height: 720px) {
  .dog-side { width: 64px; height: 56px; }
  .dog-side img { width: 46px; height: 46px; }
}
#game-canvas {
  background: #fff7ef;
  border: 4px solid #8b4513;
  border-radius: 12px;
  box-shadow: 0 6px 0 #5c3317, 0 10px 30px rgba(139,69,19,0.25);
  display: block;
}

/* Side panel with preview, hold, gauge, and dog */
.side-panel {
  display: flex;
  flex-direction: column;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}
.mini-box {
  background: #fff;
  border: 3px solid #8b4513;
  border-radius: 12px;
  padding: 3px 4px 2px;
  box-shadow: 0 3px 0 #5c3317;
  text-align: center;
}
.mini-box .mini-label {
  font-size: 9px;
  color: #8b4513;
  font-weight: 900;
  letter-spacing: 0.1em;
  line-height: 1;
  margin-bottom: 2px;
}
.mini-box canvas {
  display: block;
  background: #fff7ef;
  border-radius: 6px;
}

/* Gauge */
.gauge-box {
  background: #fff;
  border: 3px solid #ff6b9d;
  border-radius: 12px;
  padding: 4px 6px;
  box-shadow: 0 3px 0 #c44678;
  width: 100%;
  max-width: 86px;
}
.gauge-box .gauge-label {
  font-size: 9px;
  color: #ff6b9d;
  font-weight: 900;
  text-align: center;
  line-height: 1.1;
  margin-bottom: 3px;
}
.gauge-bar-outer {
  width: 100%;
  height: 10px;
  background: #ffe0ed;
  border: 2px solid #c44678;
  border-radius: 999px;
  overflow: hidden;
  position: relative;
}
.gauge-bar-inner {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff9ec4 0%, #ff6b9d 50%, #ff3b6e 100%);
  border-radius: 999px;
  transition: width 0.3s;
  position: relative;
}
.gauge-bar-inner::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  animation: gaugeShine 1.5s linear infinite;
}
@keyframes gaugeShine {
  from { transform: translateX(-100%); }
  to   { transform: translateX(100%); }
}
.gauge-paws {
  font-size: 10px; line-height: 1; text-align: center; margin-top: 2px;
  letter-spacing: 1px;
}
.gauge-box.ready {
  animation: gaugeReadyPulse 0.7s ease-in-out infinite alternate;
}
@keyframes gaugeReadyPulse {
  from { box-shadow: 0 3px 0 #c44678, 0 0 8px #ff6b9d; }
  to   { box-shadow: 0 3px 0 #c44678, 0 0 22px #ff3b6e; }
}

/* Dog side container (Carbuncle-style) */
.dog-side {
  margin-top: 4px;
  position: relative;
  width: 86px; height: 78px;
  display: flex; align-items: flex-end; justify-content: center;
  pointer-events: none;
}
.dog-side img {
  width: 64px; height: 64px; border-radius: 50%;
  border: 4px solid #fff;
  box-shadow: 0 4px 0 #8b4513, 0 0 0 3px #ff6b9d;
  background: #fff;
  animation: dogIdle 2.4s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes dogIdle {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50%      { transform: translateY(-4px) rotate(2deg); }
}
.dog-side.hop img {
  animation: dogHop 0.45s ease-out;
}
@keyframes dogHop {
  0%   { transform: translateY(0) scale(1,1); }
  30%  { transform: translateY(-18px) scale(0.9,1.15); }
  60%  { transform: translateY(-22px) scale(1.1,0.9); }
  100% { transform: translateY(0) scale(1,1); }
}
.dog-side.spin img {
  animation: dogSpin 0.7s linear;
}
@keyframes dogSpin {
  from { transform: rotate(0); }
  to   { transform: rotate(360deg); }
}
.dog-side.eat img {
  animation: dogEat 0.4s ease-in-out;
}
@keyframes dogEat {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.15,0.88); }
}

/* Sparkles around dog */
.dog-side .sparkle {
  position: absolute;
  font-size: 16px;
  opacity: 0;
  pointer-events: none;
}
.dog-side.sparkling .sparkle {
  animation: sparkleFly 0.9s ease-out forwards;
}
.dog-side .sparkle:nth-child(2) { top: 8px; left: 0;   animation-delay: 0s; }
.dog-side .sparkle:nth-child(3) { top: 4px; right: 0;  animation-delay: 0.1s; }
.dog-side .sparkle:nth-child(4) { top: 28px; left: -8px; animation-delay: 0.2s; }
.dog-side .sparkle:nth-child(5) { top: 28px; right: -8px; animation-delay: 0.15s; }
@keyframes sparkleFly {
  0%   { opacity: 0; transform: translateY(0) scale(0.5); }
  30%  { opacity: 1; transform: translateY(-8px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-30px) scale(0.7) rotate(180deg); }
}

/* Dog speech bubble */
/* ボス戦とけんの居場所。吹き出しの高さぶんだけ上に余白を取り、必殺ゲージと重ならないようにする */
#side-bottom {
  position: relative;
  width: 100%;
  margin-top: 32px;
  display: flex; flex-direction: column; align-items: center;
}
#dog-bubble {
  position: absolute;
  bottom: 100%; margin-bottom: 6px; left: 50%;
  transform: translateX(-50%) scale(0);
  background: #fff;
  border: 3px solid #ff6b9d;
  border-radius: 12px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 900;
  color: #c44678;
  white-space: nowrap;
  box-shadow: 0 3px 0 #c44678;
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 5;
  max-width: 160px;
}
#dog-bubble::after {
  content: ""; position: absolute;
  bottom: -10px; left: 50%; transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: #ff6b9d;
}
#dog-bubble::before {
  content: ""; position: absolute;
  bottom: -6px; left: 50%; transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: #fff;
  z-index: 1;
}
#dog-bubble.show { transform: translateX(-50%) scale(1); }

/* ===== TOUCH CONTROLS ===== */
.touch-controls {
  display: flex;
  gap: 10px;
  padding: 6px 8px 10px;
  width: 100%;
  max-width: 460px;
  flex-shrink: 0;
  align-items: stretch;
}
.dpad {
  flex: 1;
  margin-left: 10%; /* 盤面の真下に来るよう右へ寄せる */
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.dpad-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}
.dpad-spacer { /* empty cell to keep down button centered under rotate */ }
.actions {
  flex: none;
  width: 96px; /* HOLD・必殺は小さく端へ */
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.actions .touch-btn { flex: 1; display: flex; align-items: center; justify-content: center; }
.touch-btn {
  background: #fff;
  color: #8b4513;
  border: 3px solid #8b4513;
  border-radius: 14px;
  font-size: 22px;
  font-weight: 900;
  padding: 14px 0;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 4px 0 #5c3317;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 0.06s, box-shadow 0.06s;
  font-family: inherit;
  user-select: none;
}
.touch-btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #5c3317;
}
.touch-btn.hold-btn {
  background: #fff4e8;
  color: #8b4513;
  font-size: 12px;
  padding: 6px 0;
}
.touch-btn.hissatsu-btn {
  background: linear-gradient(135deg, #ff9ec4, #ff3b6e);
  color: #fff;
  border-color: #c44678;
  box-shadow: 0 4px 0 #8a2750;
  font-size: 13px;
  padding: 6px 0;
}
.touch-btn.hissatsu-btn:active { box-shadow: 0 1px 0 #8a2750; }
.touch-btn.hissatsu-btn.ready {
  animation: hissatsuReady 0.6s ease-in-out infinite alternate;
}
@keyframes hissatsuReady {
  from { box-shadow: 0 4px 0 #8a2750, 0 0 8px #ff6b9d; transform: translateY(0); }
  to   { box-shadow: 0 4px 0 #8a2750, 0 0 24px #ff3b6e; transform: translateY(-2px); }
}

/* ===== HISSATSU EFFECT ===== */
#hissatsu-effect {
  position: fixed; top:0; left:0; width:100%; height:100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; z-index: 200;
  transition: opacity 0.25s;
  background: radial-gradient(ellipse at center, rgba(255,107,157,0.6) 0%, rgba(255,183,77,0.3) 50%, rgba(0,0,0,0) 75%);
}
#hissatsu-effect.active { opacity: 1; pointer-events: auto; }
#hissatsu-title {
  font-size: 28px; font-weight: 900;
  text-shadow: 0 0 24px currentColor, 3px 3px 0 #fff, -1px -1px 0 #000;
  text-align: center;
  animation: hissatsuTitleIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes hissatsuTitleIn {
  from { transform: scale(0) rotate(-20deg); opacity: 0; }
  to   { transform: scale(1) rotate(0); opacity: 1; }
}
#hissatsu-sub {
  font-size: 14px; color: #5c3317; margin-top: 6px;
  background: #fff; padding: 4px 12px; border-radius: 999px;
  border: 3px solid #8b4513;
  box-shadow: 0 3px 0 #5c3317;
}
#hissatsu-dog-img {
  width: 80px; height: 80px; border-radius: 50%;
  border: 5px solid #fff;
  box-shadow: 0 0 0 4px #ff6b9d, 0 6px 20px rgba(0,0,0,0.3);
  margin-top: 14px;
  animation: hissatsuSpin 0.7s linear;
}
@keyframes hissatsuSpin {
  from { transform: rotate(0) scale(0.5); }
  to   { transform: rotate(720deg) scale(1); }
}

/* ===== OVERLAY ===== */
#overlay {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: rgba(255,230,240,0.92);
  backdrop-filter: blur(6px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 300;
  padding: 20px;
}
#overlay.hidden { display: none; }
#overlay { overflow-y: auto; justify-content: flex-start; padding-top: 28px; -webkit-overflow-scrolling: touch; }
/* スマホ：タイトル画面を1画面に収める */
@media (max-width: 480px), (max-height: 900px) {
  #overlay { padding-top: 12px; padding-bottom: 16px; }
  #overlay img#title-art { max-width: 200px; margin-bottom: 6px; }
  #overlay h1 { font-size: 23px; margin-bottom: 4px; }
  #overlay .overlay-sub { font-size: 12px; margin-bottom: 5px; }
  #overlay .overlay-score { font-size: 12px; padding: 4px 12px; margin-bottom: 8px; }
  .tutorial { padding: 5px 10px; margin-bottom: 8px; }
  .tuto-row { font-size: 11px; padding: 2px 0; }
  .tuto-key { min-width: 46px; font-size: 10px; padding: 1px 6px; }
  .overlay-stats { margin-bottom: 6px; font-size: 11px; }
  .btn-col { gap: 7px; }
  #overlay .btn-col button { padding: 10px 8px !important; font-size: 14px !important; }
}
#overlay img {
  width: 96px; height: 96px; border-radius: 50%;
  margin-bottom: 16px;
  border: 5px solid #fff;
  box-shadow: 0 0 0 4px #ff6b9d, 0 8px 20px rgba(0,0,0,0.15);
  animation: overlayDogBob 2s ease-in-out infinite;
}
@keyframes overlayDogBob {
  0%,100% { transform: translateY(0) rotate(-3deg); }
  50%     { transform: translateY(-8px) rotate(3deg); }
}
#overlay h1 {
  font-size: 32px; font-weight: 900;
  background: linear-gradient(135deg, #ff6b9d 0%, #ff9966 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  text-align: center;
}
#overlay .overlay-sub {
  font-size: 15px; color: #8b4513; margin-bottom: 8px; text-align: center;
}
#overlay .overlay-score {
  font-size: 18px; color: #c44678;
  background: #fff;
  padding: 6px 18px; border-radius: 999px;
  border: 3px solid #ff6b9d;
  box-shadow: 0 3px 0 #c44678;
  margin-bottom: 18px;
}
#overlay button {
  background: linear-gradient(135deg, #ff9ec4, #ff3b6e);
  color: #fff; border: 4px solid #c44678; border-radius: 999px;
  padding: 14px 40px; font-size: 20px; font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 0 #8a2750;
  font-family: inherit;
  transition: transform 0.08s, box-shadow 0.08s;
}
#overlay button:active {
  transform: translateY(3px); box-shadow: 0 2px 0 #8a2750;
}

/* Tutorial in start overlay */
.tutorial {
  background: #fff;
  border: 3px solid #ff6b9d;
  border-radius: 14px;
  padding: 8px 14px;
  margin-bottom: 14px;
  box-shadow: 0 3px 0 #c44678;
  max-width: 280px;
  width: 100%;
}
.tutorial.hidden { display: none; }
.tuto-row {
  display: flex; align-items: center; gap: 10px;
  padding: 3px 0;
  font-size: 13px; color: #5c3317;
}
.tuto-key {
  background: linear-gradient(135deg, #ffe8d6, #ffd4cc);
  border: 2px solid #8b4513;
  border-radius: 6px;
  padding: 2px 8px;
  font-weight: 900; color: #8b4513;
  min-width: 58px; text-align: center; flex-shrink: 0;
  font-size: 12px;
}

/* Overlay stats (clear count) */
.overlay-stats {
  font-size: 12px; color: #8b4513;
  margin-bottom: 10px;
  text-align: center;
  line-height: 1.5;
}
.overlay-stats strong { color: #c44678; font-size: 14px; }

/* Idle / pause/ tutorial hidden state */
#overlay.tutorial-hidden .tutorial { display: none; }
@media (max-width: 400px) {
  .tuto-row { font-size: 12px; }
  .tutorial { padding: 6px 10px; }
}

/* ===== PARTICLES (line clear confetti) ===== */
#particle-layer {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 150; overflow: hidden;
}
.confetti {
  position: absolute;
  width: 10px; height: 10px;
  font-size: 18px;
  will-change: transform, opacity;
  animation: confettiFall 1.6s ease-out forwards;
}
@keyframes confettiFall {
  0%   { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
  100% { opacity: 0; transform: translateY(var(--dy,200px)) translateX(var(--dx,0)) rotate(var(--rot,360deg)) scale(0.6); }
}

/* ===== Milestone popup ===== */
.milestone-pop {
  position: fixed; top: 28%; left: 50%;
  transform: translate(-50%,-50%);
  font-size: 34px; font-weight: 900;
  text-shadow: 3px 3px 0 #fff, 5px 5px 0 rgba(0,0,0,0.15);
  pointer-events: none; z-index: 180;
  animation: milestoneFade 1.8s ease-out forwards;
  white-space: nowrap;
}
@keyframes milestoneFade {
  0%   { opacity:0; transform: translate(-50%,-50%) scale(0.4) rotate(-10deg); }
  20%  { opacity:1; transform: translate(-50%,-55%) scale(1.3) rotate(5deg); }
  50%  { opacity:1; transform: translate(-50%,-60%) scale(1) rotate(0); }
  100% { opacity:0; transform: translate(-50%,-90%) scale(0.7) rotate(0); }
}

/* Shake */
.shake { animation: shakeAnim 0.15s infinite alternate; }
@keyframes shakeAnim { from{transform:translateX(-3px)} to{transform:translateX(3px)} }

/* Screen shake (bigger, for tetris/hissatsu) */
.game-container.screen-shake { animation: screenShake 0.5s cubic-bezier(0.36,0.07,0.19,0.97); }
.game-container.screen-shake-big { animation: screenShakeBig 0.7s cubic-bezier(0.36,0.07,0.19,0.97); }
@keyframes screenShake {
  10%, 90% { transform: translate(-2px,0); }
  20%, 80% { transform: translate(3px,0); }
  30%, 50%, 70% { transform: translate(-5px,1px); }
  40%, 60% { transform: translate(5px,-1px); }
}
@keyframes screenShakeBig {
  10%, 90% { transform: translate(-4px,-2px) rotate(-0.3deg); }
  20%, 80% { transform: translate(6px,2px) rotate(0.3deg); }
  30%, 50%, 70% { transform: translate(-9px,3px) rotate(-0.5deg); }
  40%, 60% { transform: translate(9px,-3px) rotate(0.5deg); }
}

/* Screen flash overlay */
#screen-flash {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 190;
  opacity: 0;
  mix-blend-mode: screen;
}
#screen-flash.on { animation: flashAnim 0.35s ease-out; }
@keyframes flashAnim {
  0% { opacity: 0; }
  20% { opacity: 0.85; }
  100% { opacity: 0; }
}

/* Dog panic */
.dog-side.panic img {
  animation: dogPanic 0.25s linear infinite !important;
  border-color: #ff3b6e !important;
  box-shadow: 0 4px 0 #8a2750, 0 0 0 3px #ff3b6e, 0 0 16px #ff3b6e !important;
}
@keyframes dogPanic {
  0%   { transform: translate(-3px,-2px) rotate(-8deg) scale(1.05); }
  25%  { transform: translate(3px,-4px) rotate(8deg) scale(1.1); }
  50%  { transform: translate(-2px,-6px) rotate(-6deg) scale(1.05); }
  75%  { transform: translate(4px,-3px) rotate(6deg) scale(1.1); }
  100% { transform: translate(-3px,-2px) rotate(-8deg) scale(1.05); }
}

/* Dog eating ramen */
.dog-side.eating-ramen img {
  animation: dogEatingRamen 0.5s ease-in-out infinite;
}
@keyframes dogEatingRamen {
  0%,100% { transform: translateY(-2px) rotate(-3deg) scale(1); }
  50%     { transform: translateY(1px)  rotate(3deg)  scale(1.04,0.95); }
}

/* Dog rare special: rainbow bounce */
.dog-side.special img {
  animation: dogSpecial 1.2s ease-in-out !important;
  box-shadow: 0 0 0 4px #ff6b9d, 0 0 20px #ffd54f, 0 0 40px #81d4fa !important;
}
@keyframes dogSpecial {
  0%   { transform: translateY(0) rotate(0) scale(1); filter: hue-rotate(0deg); }
  20%  { transform: translateY(-30px) rotate(-20deg) scale(1.2); filter: hue-rotate(90deg); }
  40%  { transform: translateY(-45px) rotate(20deg) scale(1.3); filter: hue-rotate(180deg); }
  60%  { transform: translateY(-30px) rotate(-15deg) scale(1.2); filter: hue-rotate(270deg); }
  80%  { transform: translateY(-15px) rotate(10deg) scale(1.1); filter: hue-rotate(360deg); }
  100% { transform: translateY(0) rotate(0) scale(1); filter: hue-rotate(0deg); }
}

/* Combo popup */
.combo-popup {
  position: fixed;
  top: 40%; left: 50%;
  transform: translate(-50%,-50%) scale(0);
  font-size: 44px;
  font-weight: 900;
  color: #fff;
  text-shadow:
    -3px -3px 0 #ff3b6e, 3px -3px 0 #ff3b6e,
    -3px 3px 0 #ff3b6e, 3px 3px 0 #ff3b6e,
    0 0 20px #ff6b9d, 0 8px 0 rgba(0,0,0,0.15);
  pointer-events: none;
  z-index: 185;
  animation: comboPop 1.2s cubic-bezier(0.34,1.56,0.64,1) forwards;
  font-family: inherit;
  white-space: nowrap;
}
.combo-popup .combo-num { font-size: 68px; color: #ffd54f; }
@keyframes comboPop {
  0%   { transform: translate(-50%,-50%) scale(0) rotate(-30deg); opacity: 0; }
  30%  { transform: translate(-50%,-55%) scale(1.4) rotate(8deg); opacity: 1; }
  60%  { transform: translate(-50%,-55%) scale(1) rotate(-3deg); opacity: 1; }
  100% { transform: translate(-50%,-75%) scale(0.85) rotate(0); opacity: 0; }
}

/* Pinch warning: game canvas pulse (softer so eyes don't tire) */
#game-canvas.danger {
  animation: dangerPulse 1.2s ease-in-out infinite alternate;
}
@keyframes dangerPulse {
  from { border-color: #8b4513; box-shadow: 0 6px 0 #5c3317, 0 10px 30px rgba(139,69,19,0.25); }
  to   { border-color: #ff6b9d; box-shadow: 0 6px 0 #c44678, 0 0 14px rgba(255,107,157,0.6); }
}

/* ===== STORY MODE ===== */
.gone { display: none !important; }

/* Boss HP bar */
/* サイドバー内の縦型バトル（ボスが上・けんが下で向かい合う） */
#boss-bar {
  display: flex; flex-direction: column; gap: 3px;
  width: 100%; max-width: none; min-width: 0;
  padding: 4px 4px 5px; flex-shrink: 0;
  background: #2a1a22;
  border: 3px solid #8a2750;
  border-radius: 12px;
  box-shadow: 0 3px 0 #57152f;
  margin: 0;
  align-self: stretch;
  box-sizing: border-box;
}
.boss-hp-row { display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
#battle-stage {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  height: auto; padding: 4px 2px;
  background: linear-gradient(to bottom,
    rgba(255,255,255,0.03) 0%,
    rgba(255,213,79,0.07) 65%,
    rgba(255,213,79,0.18) 100%);
  border-radius: 10px;
  overflow: hidden;
}
#stage-vs {
  align-self: center;
  color: rgba(255,217,232,0.45);
  font-size: 12px; font-weight: 900; letter-spacing: 1px;
}
#boss-face {
  width: 40px; height: 40px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  background: #1a1016; border: 2px solid #ff3b6e;
  overflow: hidden;
}
#boss-face.lunge { animation: bossLunge 0.45s ease-out; }
@keyframes bossLunge {
  0%   { transform: none; }
  30%  { transform: translateX(38px) scale(1.12); }
  100% { transform: none; }
}
#boss-face.windup { animation: bossWindup 0.22s infinite alternate; }
@keyframes bossWindup {
  from { transform: translateX(-2px) scale(1); border-color: #ff3b6e; }
  to   { transform: translateX(2px) scale(1.15); border-color: #ffd54f; }
}
#boss-face.punch { animation: bossPunchAnim 0.4s ease-out; }
@keyframes bossPunchAnim {
  0%   { transform: scale(1.5) translateY(5px); }
  100% { transform: scale(1) translateY(0); }
}
#boss-face.hit { animation: bossHitAnim 0.4s; }
@keyframes bossHitAnim {
  0%, 40%  { transform: translateX(-4px); filter: brightness(2.2); }
  20%, 60% { transform: translateX(4px); }
  100%     { transform: translateX(0); filter: none; }
}
#boss-name {
  font-size: 9px; font-weight: 900; color: #ffd9e8;
  line-height: 1.2; text-align: center;
  white-space: normal; overflow: visible; text-overflow: clip;
  flex-shrink: 0; max-width: 100%; word-break: break-all;
}
.boss-hp-outer {
  flex: none; width: 100%; height: 8px; box-sizing: border-box;
  background: #57152f; border: 2px solid #ff6b9d; border-radius: 999px;
  overflow: hidden;
}
#boss-hp {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ff3b6e, #ffd54f);
  border-radius: 999px; transition: width 0.35s;
}
#boss-hp.critical {
  background: #ff2244;
  animation: hpCritical 0.4s infinite alternate;
}
@keyframes hpCritical { from { opacity: 1; } to { opacity: 0.35; } }
#boss-warn {
  position: absolute; top: 4px; left: 50%;
  transform: translateX(-50%);
  font-size: 20px;
  animation: warnBlink 0.3s infinite alternate;
}
@keyframes warnBlink { from { opacity: 0.3; } to { opacity: 1; } }

/* けん（バトル時の自軍側・ファイトポーズ）＆飛び道具 */
#ken-face {
  width: 48px; height: 42px;
  flex-shrink: 0;
  display: flex; align-items: flex-end; justify-content: center;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45));
}
#ken-face img { width: 100%; height: 100%; object-fit: contain; display: block; }
#ken-face.lunge { animation: kenLunge 0.45s ease-out; }
@keyframes kenLunge {
  0%   { transform: none; }
  30%  { transform: translateX(-38px) scale(1.12); }
  100% { transform: none; }
}
.dmg-float {
  position: absolute; top: 0; left: 62px;
  font-size: 24px; font-weight: 900; color: #ffd54f;
  text-shadow: 2px 2px 0 #8a2750, -1px -1px 0 #8a2750;
  z-index: 7; pointer-events: none;
  animation: dmgFloat 0.95s ease-out forwards;
}
.dmg-float.hurt { left: auto; right: 62px; color: #ff6b9d; }
@keyframes dmgFloat {
  0%   { opacity: 0; transform: translateY(8px) scale(0.6); }
  25%  { opacity: 1; transform: translateY(-6px) scale(1.3); }
  100% { opacity: 0; transform: translateY(-30px) scale(1); }
}
#ken-face img { width: 100%; height: 100%; display: block; }
#ken-face.hit { animation: kenHitAnim 0.5s; }
@keyframes kenHitAnim {
  0%, 40%  { transform: translateX(5px) rotate(10deg); border-color: #ff3b6e; filter: brightness(1.7) saturate(2); }
  20%, 60% { transform: translateX(-5px) rotate(-8deg); }
  100%     { transform: translateX(0) rotate(0); filter: none; }
}
.projectile {
  position: absolute; top: 50%;
  font-size: 34px; z-index: 5; pointer-events: none;
  transform: translateY(-50%);
  filter: drop-shadow(0 0 8px rgba(255,213,79,0.95));
}
.projectile.to-ken  { animation: flyToKen 0.38s ease-in forwards; }
.projectile.to-boss { animation: flyToBoss 0.38s ease-in forwards; }
@keyframes flyToKen {
  from { left: 62px; transform: translateY(-50%) scale(0.8) rotate(0); }
  to   { left: calc(100% - 100px); transform: translateY(-50%) scale(1.3) rotate(40deg); }
}
@keyframes flyToBoss {
  from { right: 68px; transform: translateY(-50%) scale(0.8) rotate(0); }
  to   { right: calc(100% - 90px); transform: translateY(-50%) scale(1.3) rotate(-40deg); }
}
.impact-burst {
  position: absolute; top: 50%;
  font-size: 26px; z-index: 6; pointer-events: none;
  transform: translateY(-50%);
  animation: impactPop 0.4s ease-out forwards;
}
@keyframes impactPop {
  0%   { opacity: 1; transform: translateY(-50%) scale(0.4); }
  60%  { opacity: 1; transform: translateY(-50%) scale(1.5); }
  100% { opacity: 0; transform: translateY(-50%) scale(1.1); }
}

.boss-shout { color: #ff3b6e !important; font-size: 24px !important; top: 20% !important; }
.dmg-pop { color: #ffd54f !important; font-size: 28px !important; top: 24% !important;
  text-shadow: 2px 2px 0 #8a2750, 4px 4px 0 rgba(0,0,0,0.3) !important; }

/* Dialogue */
#dialogue-layer {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(20, 8, 14, 0.55);
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 12px;
}
#dlg-cg {
  max-width: min(90vw, 440px); max-height: 38vh;
  border-radius: 14px; border: 3px solid #fff;
  box-shadow: 0 6px 24px rgba(0,0,0,0.5);
  margin: 0 auto 10px;
  display: block;
}
#dlg-skip {
  position: absolute; top: 10px; right: 10px;
  background: rgba(255,255,255,0.9); color: #8b4513;
  border: 2px solid #8b4513; border-radius: 999px;
  padding: 4px 12px; font-size: 12px; font-weight: 900;
  font-family: inherit; cursor: pointer;
}
.dlg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 460px; margin: 0 auto 8px; width: 100%; }
#dlg-portrait {
  width: 56px; height: 56px; border-radius: 50%;
  border: 3px solid #fff; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,0.4);
}
#dlg-portrait img { width: 100%; height: 100%; }
.dlg-box {
  flex: 1; background: #fff;
  border: 4px solid #5c3317; border-radius: 16px;
  padding: 10px 14px 16px; position: relative;
  box-shadow: 0 4px 0 #3a2010;
  min-height: 84px;
}
#dlg-name {
  display: inline-block;
  background: #5c3317; color: #fff;
  font-size: 11px; font-weight: 900;
  border-radius: 999px; padding: 2px 10px;
  margin-bottom: 4px;
}
#dlg-text { font-size: 14px; line-height: 1.7; color: #3a2010; white-space: pre-line; }
#dlg-text.narration { color: #8b7355; font-size: 13px; }
.dlg-next {
  position: absolute; right: 12px; bottom: 6px;
  font-size: 12px; color: #c44678;
  animation: dlgNextBlink 0.8s infinite alternate;
}
@keyframes dlgNextBlink { from { opacity: 0.2; } to { opacity: 1; transform: translateY(2px); } }

/* Story cards (opening / epilogue / end roll) */
#card-layer {
  position: fixed; inset: 0; z-index: 410;
  background: #14090f;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 28px; text-align: center;
}
#card-text {
  color: #ffe9f2; font-size: 16px; line-height: 2.1; font-weight: 700;
  white-space: pre-line; max-width: 420px;
}
#card-text.big { font-size: 44px; letter-spacing: 0.3em; }
#card-text.small { font-size: 13px; color: #c9a3b4; }
#card-art {
  border: 2px dashed #8a5a6e; border-radius: 12px;
  color: #c9a3b4; font-size: 12px; line-height: 1.8;
  padding: 26px 18px; max-width: 380px; width: 100%;
  white-space: pre-line;
}
.card-hint {
  position: absolute; bottom: 18px; left: 0; right: 0;
  text-align: center; color: #8a5a6e; font-size: 11px;
  animation: dlgNextBlink 0.9s infinite alternate;
}

/* Cut-in (親子丼波・パチンコ大当たり演出) */
#cutin-layer {
  position: fixed; inset: 0; z-index: 420;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.06) 0 6px, transparent 6px 26px),
    radial-gradient(ellipse at center, #57152f 0%, #14090f 75%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 24px; text-align: center;
  overflow: hidden;
}
#cutin-flash {
  position: absolute; inset: 0; background: #fff;
  opacity: 0; pointer-events: none; z-index: 10;
}
#cutin-flash.blink { animation: cutinBlink 0.55s steps(1) 3; }
@keyframes cutinBlink { 0% { opacity: 0.9; } 50% { opacity: 0; } 100% { opacity: 0; } }
#cutin-rays {
  position: absolute; left: -30%; top: -30%;
  width: 160%; height: 160%;
  object-fit: cover;
  opacity: 0; z-index: 1; pointer-events: none;
}
#cutin-rays.on { opacity: 1; animation: raysSpin 7s linear infinite; }
@keyframes raysSpin {
  from { transform: rotate(0) scale(1); }
  50%  { transform: rotate(180deg) scale(1.18); }
  to   { transform: rotate(360deg) scale(1); }
}
.cutin-band {
  position: absolute; left: 0; width: 100%; height: 26%;
  object-fit: cover; z-index: 5;
  box-shadow: 0 0 30px rgba(0,0,0,0.65);
  border-top: 4px solid #ffd54f; border-bottom: 4px solid #ffd54f;
}
#cutin-band-father { top: 9%; transform: translateX(-130%) skewY(-3deg); }
#cutin-band-ken { top: 40%; transform: translateX(130%) skewY(-3deg); }
.cutin-band.slam-left { animation: slamLeft 0.32s cubic-bezier(0.2,1.4,0.4,1) forwards; }
.cutin-band.slam-right { animation: slamRight 0.32s cubic-bezier(0.2,1.4,0.4,1) forwards; }
@keyframes slamLeft { to { transform: translateX(0) skewY(-3deg); } }
@keyframes slamRight { to { transform: translateX(0) skewY(-3deg); } }
.cutin-band.out { animation: bandOut 0.3s ease-in forwards; }
@keyframes bandOut { to { opacity: 0; transform: translateX(0) skewY(-3deg) scale(1.12); } }
#cutin-img, #cutin-title { position: relative; z-index: 6; }
#cutin-art {
  border: 2px dashed #ff6b9d; border-radius: 12px;
  color: #ffb3cc; font-size: 12px; line-height: 1.8;
  padding: 34px 20px; max-width: 380px;
  white-space: pre-line;
}
#cutin-title {
  font-size: 36px; font-weight: 900; color: #fff;
  text-shadow: -3px -3px 0 #ff3b6e, 3px -3px 0 #ff3b6e, -3px 3px 0 #ff3b6e, 3px 3px 0 #ff3b6e, 0 0 34px #ffd54f;
  animation: cutinZoom 0.5s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
  transform: skewX(-8deg) rotate(-4deg);
}
@keyframes cutinZoom {
  from { transform: scale(3) skewX(-8deg); opacity: 0; }
  to   { transform: scale(1) skewX(-8deg) rotate(-4deg); opacity: 1; }
}

/* Story art assets */
#card-img {
  max-width: min(90vw, 480px); max-height: 42vh;
  border-radius: 14px; border: 2px solid #57303f;
  display: block;
}
#cutin-img {
  max-width: min(92vw, 560px); max-height: 55vh;
  border-radius: 12px; border: 3px solid #ff6b9d;
  box-shadow: 0 0 40px rgba(255,213,79,0.5);
  animation: cutinZoom 0.5s cubic-bezier(0.34,1.56,0.64,1);
  display: block;
}
#boss-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
#dlg-portrait img { object-fit: cover; }
#overlay img#title-art {
  width: 100%; max-width: 270px; height: auto;
  border-radius: 14px; border: 3px solid #8b4513;
  box-shadow: 0 4px 0 #5c3317;
  margin-bottom: 12px;
  animation: none;
}
#story-bgimg {
  position: fixed; right: 0; bottom: 0;
  width: 45vw; max-width: 380px;
  opacity: 0.22; z-index: 0; pointer-events: none;
}

/* 縛りプレイ表示（初回クリア後のみ） */
#pure-chip {
  position: fixed; top: 6px; left: 8px; z-index: 120;
  font-size: 11px; font-weight: 900;
  padding: 3px 10px; border-radius: 999px;
  pointer-events: none;
}
#pure-chip.pure-on {
  background: rgba(255,213,79,0.95); color: #7a4a00;
  box-shadow: 0 2px 0 rgba(154,106,0,0.6);
}
#pure-chip.pure-off {
  background: rgba(120,110,115,0.55); color: #fff;
}

/* 真エンディング（店主の後ろ姿） */
#card-layer.true-end {
  background: #0a0507;
}
#card-layer.true-end #card-text {
  color: #ffe9d2; letter-spacing: 0.06em;
}
#card-layer.true-end #card-text.big {
  font-size: 34px; letter-spacing: 0.18em; color: #ffd54f;
  text-shadow: 0 0 26px rgba(255,190,80,0.55);
}
#card-master {
  max-width: min(88vw, 440px); max-height: 44vh;
  border-radius: 10px; display: block;
  filter: brightness(0.92) contrast(1.05);
}
/* 写真が無くても成立するよう、湯気の演出を背後に置く */
#card-layer.true-end::before {
  content: ""; position: absolute; left: 50%; bottom: 0;
  width: 70vw; height: 60vh; transform: translateX(-50%);
  background: radial-gradient(ellipse at bottom, rgba(255,196,120,0.20) 0%, transparent 70%);
  animation: steamRise 6s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes steamRise {
  from { opacity: 0.5; transform: translateX(-50%) translateY(10px) scale(1); }
  to   { opacity: 0.9; transform: translateX(-50%) translateY(-10px) scale(1.06); }
}

/* 真エンディングのヒント（初回クリア後にタイトルへ出る） */
#true-hint {
  font-size: 11px; color: #8b4513;
  background: #fff8ec; border: 2px dashed #c9a06a;
  border-radius: 12px; padding: 6px 12px; margin-bottom: 10px;
  max-width: 300px; text-align: center; line-height: 1.6;
}
/* 低い画面：タイトルを1画面に収める（下のボタンが画面外に落ちるのを防ぐ） */
@media (max-height: 800px) {
  #title-art { max-height: 130px; }
  #true-hint { font-size: 10px; padding: 5px 10px; margin-bottom: 6px; }
  #overlay-score { margin-bottom: 8px; }
}

/* QTE（親子丼波・発動コマンド入力） */
#qte-layer {
  position: fixed; top: 7%; left: 0; right: 0;
  display: flex; justify-content: center;
  pointer-events: none; z-index: 415;
}
#qte-box {
  background: rgba(20, 8, 14, 0.92);
  border: 3px solid #ffd54f;
  border-radius: 16px;
  padding: 12px 18px 14px;
  text-align: center;
  box-shadow: 0 0 30px rgba(255,213,79,0.5);
  max-width: 92vw;
}
#qte-box.shake { animation: shakeAnim 0.1s 4 alternate; }
#qte-title {
  font-size: 20px; font-weight: 900; color: #ffd54f;
  text-shadow: 2px 2px 0 #8a2750;
  margin-bottom: 2px;
}
#qte-father { font-size: 12px; color: #ffd9e8; margin-bottom: 8px; }
#qte-seq { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.qte-icon {
  width: 34px; height: 34px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900;
  background: #3a2430; color: #ffd9e8;
  border: 2px solid #8a2750;
}
.qte-icon.cur {
  border-color: #ffd54f; color: #ffd54f;
  animation: qteCurPulse 0.5s infinite alternate;
}
.qte-icon.done { background: #ffd54f; color: #57152f; border-color: #fff; }
@keyframes qteCurPulse { from { transform: scale(1); } to { transform: scale(1.18); } }
.qte-timer-outer {
  width: 100%; height: 8px;
  background: #3a2430; border-radius: 999px; overflow: hidden;
  margin-bottom: 6px;
  display: flex; justify-content: flex-end; /* ゲージは左から右へ減る（入力の進行方向と同じ） */
}
#qte-timer {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ff3b6e, #ffd54f);
  border-radius: 999px;
}
#qte-timer.run { transition: width 3s linear; width: 0%; }
#qte-hint { font-size: 10px; color: #c9a3b4; }

/* Omen darken */
#omen-layer {
  position: fixed; inset: 0; z-index: 160;
  background: #000; opacity: 0; pointer-events: none;
  transition: opacity 0.8s;
}
#omen-layer.on { opacity: 0.55; }

/* Overlay mode buttons */
.btn-col { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; max-width: 300px; }

<script>
// ===== AUDIO ENGINE =====
let audioCtx = null;
let bgmPlaying = false;
let masterGain = null;
let sfxGain = null; // 効果音専用（BGMのオン/オフに巻き込まれない）
let bgmScheduleTimeout = null;
let currentBGMTier = 0;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.22;
    masterGain.connect(audioCtx.destination);
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.25;
    sfxGain.connect(audioCtx.destination);
  }
  // iOSは明示的にresumeしないと永久に無音（タップ操作中の呼び出しなら許可される）
  if (audioCtx.state !== 'running') audioCtx.resume(); // suspended/interrupted両方から復帰
  return audioCtx;
}
// 最初のタップで音を確実に起こす（iOS対策）
// さらに無音の<audio>をループ再生して「メディア再生中」扱いにすることで、
// 消音スイッチ（マナーモード）ONでも効果音が鳴るようにする
var silentUnlock = null;
document.addEventListener('pointerdown', function() {
  var ac = getAudioCtx();
  if (ac.state !== 'running') ac.resume(); // suspended/interrupted両方から復帰
  if (!silentUnlock) {
    // 実体のある無音ファイルをループ再生し、iOSに「メディア再生中」と認識させる
    // （これをやらないと消音スイッチONのとき効果音が全部消える）
    silentUnlock = new Audio('assets/story/bgm/silence.mp3');
    silentUnlock.loop = true;
    silentUnlock.volume = 0.01;
    silentUnlock.setAttribute('playsinline', '');
    var p = silentUnlock.play();
    if (p && p.catch) p.catch(function() { silentUnlock = null; });
  } else if (silentUnlock.paused) {
    silentUnlock.play().catch(function() {});
  }
}, true);

const NOTE_FREQ = {
  'C3':130.81,'D3':146.83,'E3':164.81,'F3':174.61,'G3':196,'A3':220,'B3':246.94,
  'C4':261.63,'D4':293.66,'E4':329.63,'F4':349.23,'G4':392,'A4':440,'A4S':466.16,'B4':493.88,
  'C5':523.25,'D5':587.33,'E5':659.25,'F5':698.46,'G5':784,'A5':880,'B5':987.77,
  'C6':1046.50,
  'R':0
};

// 麺やけんオリジナルテーマ（warm, hearty, BPM 118）
// テンポは通しで一定。区切りではメロディを変えずファンファーレのみ鳴らす。
const BGM_BPM = 118;
const MELODY_MAIN = [
  ['C5',0.75],['E5',0.25],['G5',0.5],['C6',0.5],
  ['B5',0.75],['G5',0.25],['E5',1.0],
  ['A4',0.75],['C5',0.25],['E5',0.5],['A5',0.5],
  ['G5',0.75],['E5',0.25],['C5',1.0],
  ['F4',0.75],['A4',0.25],['C5',0.5],['F5',0.5],
  ['E5',0.75],['C5',0.25],['A4',1.0],
  ['G4',0.5],['B4',0.5],['D5',0.5],['G5',0.5],
  ['F5',0.75],['D5',0.25],['C5',1.0],['G4',0.5],
  ['C5',2.0]
];
const BASS_MAIN = [
  ['C3',1],['G3',1],['A3',1],['E3',1],
  ['F3',1],['G3',1],['C3',1],['G3',1]
];
function getMelody(tier) { return MELODY_MAIN; }
function getBass(tier)   { return BASS_MAIN; }
function getBPM(tier)    { return BGM_BPM; }

function playNote(freq, startTime, duration, type, vol, ac) {
  if (!freq || freq === 0) return;
  type = type || 'square'; vol = vol || 0.15; ac = ac || audioCtx;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(vol, startTime + 0.01);
  gain.gain.setValueAtTime(vol, startTime + duration * 0.7);
  gain.gain.linearRampToValueAtTime(0, startTime + duration * 0.98);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(startTime);
  osc.stop(startTime + duration);
}

function scheduleBGMLoop(startTime) {
  if (!bgmPlaying) return;
  var ac = getAudioCtx();
  var melody = getMelody(currentBGMTier);
  var bass = getBass(currentBGMTier);
  var beat = 60 / getBPM(currentBGMTier);
  var t = startTime;
  for (var i = 0; i < melody.length; i++) {
    var note = melody[i][0], beats = melody[i][1];
    var dur = beats * beat;
    var freq = NOTE_FREQ[note] || 0;
    // Softer melody: sine wave + lower vol. Less piercing.
    playNote(freq, t, dur * 0.85, 'sine', 0.07, ac);
    t += dur;
  }
  var bt = startTime;
  while (bt < t) {
    for (var j = 0; j < bass.length; j++) {
      if (bt >= t) break;
      var bn = bass[j][0], bb = bass[j][1];
      var bdur = bb * beat;
      var bfreq = NOTE_FREQ[bn] || 0;
      playNote(bfreq, bt, bdur * 0.7, 'triangle', 0.06, ac);
      bt += bdur;
    }
  }
  var loopDuration = t - startTime;
  bgmScheduleTimeout = setTimeout(function() { scheduleBGMLoop(ac.currentTime + 0.05); }, (loopDuration - 0.2) * 1000);
}

function startBGM() {
  if (bgmPlaying) return;
  var ac = getAudioCtx();
  if (ac.state !== 'running') ac.resume(); // suspended/interrupted両方から復帰
  bgmPlaying = true;
  scheduleBGMLoop(ac.currentTime + 0.1);
  var btn = document.getElementById('bgm-btn');
  btn.innerHTML = '\uD83C\uDFB5 BGM';
  btn.classList.add('on');
}
function stopBGM() {
  bgmPlaying = false;
  clearTimeout(bgmScheduleTimeout);
  var btn = document.getElementById('bgm-btn');
  btn.innerHTML = '\uD83D\uDD07 BGM';
  btn.classList.remove('on');
}
// 3-state BGM: off → low → on → off
var bgmLevel = 1; // 0=off, 1=low, 2=on
function setBGMLevel(lv) {
  bgmLevel = lv;
  if (masterGain) {
    if (lv === 0) masterGain.gain.value = 0;
    else if (lv === 1) masterGain.gain.value = 0.14;
    else masterGain.gain.value = 0.22;
  }
  if (typeof storyBgmEl !== 'undefined' && storyBgmEl) storyBgmEl.volume = storyVol();
  var btn = document.getElementById('bgm-btn');
  if (lv === 0) {
    if (bgmPlaying) stopBGM();
    btn.innerHTML = '\uD83D\uDD07 BGM';
    btn.classList.remove('on');
  } else {
    if (!bgmPlaying && MODE !== 'story') startBGM();
    btn.innerHTML = (lv === 1 ? '\uD83D\uDD09' : '\uD83C\uDFB5') + ' BGM';
    btn.classList.add('on');
  }
}
function toggleBGM() { setBGMLevel((bgmLevel + 1) % 3); }

function restartBGMWithNewTier(tier) {
  // Single-tune mode: just remember the tier for milestone tracking,
  // but don't interrupt the current loop.
  currentBGMTier = tier;
}

let milestoneHit = { 1: false, 2: false, 3: false };

function checkBGMTier() {
  var newTier = 0;
  if (score >= 9000) newTier = 3;
  else if (score >= 6000) newTier = 2;
  else if (score >= 3000) newTier = 1;

  if (newTier > currentBGMTier && !milestoneHit[newTier]) {
    milestoneHit[newTier] = true;
    var msgs = { 1: 'よっしゃ！3000点！', 2: 'やるやん！6000点！', 3: 'ここからや！9000点！' };
    var cols = { 1: '#ff9966', 2: '#ff6b9d', 3: '#c44678' };
    showDogBubble(msgs[newTier], cols[newTier]);
    triggerDogHop('sparkling');
    sfxMilestone(newTier);
    showMilestoneEffect(msgs[newTier], cols[newTier]);
    restartBGMWithNewTier(newTier);
  } else if (newTier > currentBGMTier) {
    restartBGMWithNewTier(newTier);
  }

  if (MODE === 'endless' && score >= 10000) triggerVictory();
}

function sfxMilestone(tier) {
  var ac = getAudioCtx();
  var t = ac.currentTime;
  var scales = { 1:[523,659,784,1047], 2:[659,784,1047,1319,1568], 3:[784,1047,1319,1568,1760,2093] };
  var freqs = scales[tier] || scales[1];
  freqs.forEach(function(f, i) {
    var osc = ac.createOscillator();
    var g = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f, t + i * 0.08);
    g.gain.setValueAtTime(0.2, t + i * 0.08);
    g.gain.linearRampToValueAtTime(0, t + i * 0.08 + 0.25);
    osc.connect(g); g.connect(sfxGain);
    osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.28);
  });
}

function showMilestoneEffect(msg, color) {
  var div = document.createElement('div');
  div.className = 'milestone-pop';
  div.style.color = color;
  div.textContent = msg;
  document.body.appendChild(div);
  setTimeout(function() { div.remove(); }, 1800);
  spawnConfetti(30, color);
}

// ===== SOUND EFFECTS =====
function sfxLand() {
  var ac = getAudioCtx(); var t = ac.currentTime;
  var osc = ac.createOscillator(); var g = ac.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(120, t);
  osc.frequency.linearRampToValueAtTime(60, t + 0.08);
  g.gain.setValueAtTime(0.25, t);
  g.gain.linearRampToValueAtTime(0, t + 0.1);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t); osc.stop(t + 0.1);
}

function sfxLineClear(count) {
  var ac = getAudioCtx(); var t = ac.currentTime;
  var scales = [
    [523, 659, 784],
    [523, 659, 784, 1047],
    [523, 659, 784, 1047, 1319],
    [523, 659, 784, 1047, 1319, 1568],
  ];
  var freqs = scales[Math.min(count - 1, 3)];
  freqs.forEach(function(f, i) {
    var osc = ac.createOscillator(); var g = ac.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(f, t + i * 0.07);
    g.gain.setValueAtTime(0, t + i * 0.07);
    g.gain.linearRampToValueAtTime(0.18, t + i * 0.07 + 0.02);
    g.gain.linearRampToValueAtTime(0, t + i * 0.07 + 0.18);
    osc.connect(g); g.connect(sfxGain);
    osc.start(t + i * 0.07); osc.stop(t + i * 0.07 + 0.2);
  });
  if (count === 4) {
    setTimeout(function() {
      var fanfare = [784, 1047, 1319, 1568, 1319, 1047, 1568];
      fanfare.forEach(function(f, i) {
        var ac2 = getAudioCtx(); var t2 = ac2.currentTime;
        var osc = ac2.createOscillator(); var g = ac2.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(f, t2 + i * 0.09);
        g.gain.setValueAtTime(0.2, t2 + i * 0.09);
        g.gain.linearRampToValueAtTime(0, t2 + i * 0.09 + 0.15);
        osc.connect(g); g.connect(sfxGain);
        osc.start(t2 + i * 0.09); osc.stop(t2 + i * 0.09 + 0.18);
      });
    }, 400);
  }
}

function sfxHissatsu() {
  var ac = getAudioCtx(); var t = ac.currentTime;
  var notes = [220, 277, 330, 440, 330, 440, 554, 659, 554, 659, 784, 1047];
  notes.forEach(function(f, i) {
    var osc = ac.createOscillator(); var g = ac.createGain();
    osc.type = i < 6 ? 'sawtooth' : 'square';
    osc.frequency.setValueAtTime(f, t + i * 0.06);
    g.gain.setValueAtTime(0.22, t + i * 0.06);
    g.gain.linearRampToValueAtTime(0, t + i * 0.06 + 0.18);
    osc.connect(g); g.connect(sfxGain);
    osc.start(t + i * 0.06); osc.stop(t + i * 0.06 + 0.2);
  });
  var osc2 = ac.createOscillator(); var g2 = ac.createGain();
  var lfo = ac.createOscillator(); var lfoG = ac.createGain();
  osc2.type = 'square';
  osc2.frequency.setValueAtTime(1047, t + 0.85);

  lfo.connect(lfoG); lfoG.connect(osc2.frequency);

// ===== BOARD OPERATIONS =====
function clearBottomN(n) {
  var toRemove = [];
  for (var r = ROWS - 1; r >= 0 && toRemove.length < n; r--) {
    if (board[r].some(function(c) { return c !== 0; })) toRemove.push(r);
  }
  toRemove.forEach(function(r) {
    board.splice(r, 1);
    board.unshift(Array(COLS).fill(0));
  });
  lines += toRemove.length;
  level = Math.floor(lines / 10) + 1;
  dropInterval = computeDropInterval(level);
  updateScoreUI('lines');
  updateScoreUI('level');
}

function clearDominantColor() {
  var count = Array(10).fill(0);
  board.forEach(function(row) { row.forEach(function(v) { if (v) count[v]++; }); });
  var maxVal = 0, dom = 0;
  for (var i = 1; i < count.length; i++) { if (count[i] > maxVal) { maxVal = count[i]; dom = i; } }
  if (!dom) return;
  board.forEach(function(row) {
    for (var c = 0; c < COLS; c++) if (row[c] === dom) row[c] = 0;
  });
  var nonEmpty = board.filter(function(row) { return row.some(function(c) { return c !== 0; }); });
  while (nonEmpty.length < ROWS) nonEmpty.unshift(Array(COLS).fill(0));
  for (var r = 0; r < ROWS; r++) board[r] = nonEmpty[r];
}

  if (count === 4) showDogBubble('4杯同時提供!! 🍜', '#e65100');
  // Rebalanced: lower gauge gain from line clears
  updateHissatsuGauge([5, 10, 20, 35][Math.min(count - 1, 3)]);
}

// ===== CORE GAME =====
function initBoard() { board = Array.from({ length: ROWS }, function() { return Array(COLS).fill(0); }); }

function randomPiece() {
  var id = Math.floor(Math.random() * 7) + 1;
  return { id: id, matrix: PIECES[id].map(function(r) { return r.slice(); }), x: 3, y: 0 };
}

function rotate(m) {
  return m[0].map(function(_, i) { return m.map(function(row) { return row[i]; }).reverse(); });
}

function isValid(piece, brd, dx, dy, matrix) {
  dx = dx || 0; dy = dy || 0;
  var m = matrix || piece.matrix;
  for (var r = 0; r < m.length; r++) {
    for (var c = 0; c < m[r].length; c++) {
      if (!m[r][c]) continue;
      var nx = piece.x + c + dx, ny = piece.y + r + dy;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return false;
      if (ny >= 0 && brd[ny][nx]) return false;
    }
  }
  return true;
}

function placePiece() {
  currentPiece.matrix.forEach(function(row, r) {
    row.forEach(function(val, c) {
      if (val) {
        var y = currentPiece.y + r, x = currentPiece.x + c;
        if (y >= 0) board[y][x] = val;
      }
    });
  });
  sfxLand();
  triggerDogEat();
  if (currentPiece.id === 7) showDogBubble('チャーシュー来た!', '#b71c1c');
  else if (currentPiece.id === 2) showDogBubble('丼ドン!\uD83C\uDF71', '#bf360c');
  else if (currentPiece.id === 1) showDogBubble('麺～!\uD83C\uDF5C', '#e65100');
  else if (currentPiece.id === 5) showDogBubble('味玉トロ～り', '#ad1457');
  // Rebalanced: +1 per piece (was +3)
  updateHissatsuGauge(1);
  updatePinchState();
}

function getGhostY() {
  var dy = 0;
  while (isValid(currentPiece, board, 0, dy + 1)) dy++;
  return currentPiece.y + dy;
}

function clearLines() {
  var full = [];
  for (var r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(function(c) { return c !== 0; })) full.push(r);
  }
  if (full.length === 0) {
    // no line cleared: reset combo
    comboCount = 0;
    return 0;
  }
  flashRows = full;
  animating = true;
  // 琥珀たまごが消える列に含まれていたか（消去前に判定）
  var hadEgg = full.some(function(r) { return board[r].some(function(v) { return v === 8; }); });
  // immediate visual FX before removal
  triggerScreenFlash('rgba(255,255,255,0.7)');
  triggerScreenShake(full.length >= 4);
  setTimeout(function() {
    full.forEach(function(r) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
    });
    flashRows = [];
    animating = false;
    var cleared = full.length;
    // combo bonus
    comboCount += 1;
    var comboBonus = comboCount >= 2 ? (comboCount - 1) * 50 * level : 0;
    // Rebalanced: singles weaker, tetris stronger → encourages stacking
    score += [0, 50, 200, 500, 1200][cleared] * level + comboBonus;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    dropInterval = computeDropInterval(level);
    updateScoreUI('score');
    updateScoreUI('level');
    updateScoreUI('lines');
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('menyaKenBest', bestScore);
      document.getElementById('best').textContent = bestScore;
    }
    showZuzozoEffect(cleared);
    if (comboCount >= 2) {
      showComboPopup(comboCount);
      triggerScreenFlash(comboCount >= 4 ? 'rgba(255,215,80,0.7)' : 'rgba(255,179,204,0.6)');
      // Extra reactions on big combos
      if (comboCount >= 3) triggerRareReaction('combo');
    }
    // Perfect clear check
    var emptyBoard = board.every(function(row) { return row.every(function(c) { return c === 0; }); });
    if (emptyBoard && !perfectClearHit) {
      perfectClearHit = true;
      score += 2000 * level;
      updateScoreUI('score');
      showMilestoneEffect('PERFECT CLEAR!', '#ffd54f');
      triggerRareReaction('perfect');
      spawnConfetti(80, '#ffd54f');
      triggerScreenFlash('rgba(255,215,80,0.9)');
      triggerScreenShake(true);
      setTimeout(function(){ perfectClearHit = false; }, 2000);
    }
    checkBGMTier();
    checkEndlessMilestone();
    updatePinchState();
    if (MODE === 'story') storyOnLinesCleared(cleared, hadEgg);
  }, 320);
  return full.length;
}

// Smoother level curve: fast-ish early, plateaus later
function computeDropInterval(lv) {
  // exponential decay, floor at 90ms
  var v = 900 * Math.pow(0.88, Math.max(0, lv - 1));
  return Math.max(90, Math.floor(v));
}

function refillQueue() {
  while (pieceQueue.length < 4) pieceQueue.push(randomPiece());
}

  // とどめフェーズ：親子の会話の後、父が3個に1個、縦棒（Iミノ）を投げ込む

// ===== DRAWING (flat + thick border) =====
function drawCell(context, x, y, colorIdx, cellSize) {
  if (!colorIdx) return;
  var cs = cellSize || CELL;
  var base = COLORS[colorIdx];
  var border = BORDERS[colorIdx];
  var px = x * cs, py = y * cs;
  var bw = Math.max(2, Math.floor(cs * 0.12));
  var radius = Math.floor(cs * 0.18);

  context.fillStyle = border;
  roundRect(context, px, py, cs, cs, radius);
  context.fill();

  context.fillStyle = base;
  roundRect(context, px + bw, py + bw, cs - bw * 2, cs - bw * 2, Math.max(1, radius - bw / 2));
  context.fill();

  // tiny highlight
  context.fillStyle = 'rgba(255,255,255,0.45)';
  context.fillRect(px + bw + 2, py + bw + 2, Math.max(2, (cs - bw * 2) * 0.28), 2);

  if (cs >= 18) {
    context.font = '900 ' + Math.floor(cs * 0.5) + 'px sans-serif';
    context.textAlign = 'center';
    context.textBaseline = 'middle';
    context.fillText(ICONS[colorIdx], px + cs / 2, py + cs / 2 + 1);
  }
}

function hexToRgba(hex, a) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawGrid() {
  ctx.fillStyle = '#fff7ef';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // soft grid dots
  ctx.fillStyle = 'rgba(139,69,19,0.10)';
  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    ctx.beginPath();
    ctx.arc(c * CELL + CELL / 2, r * CELL + CELL / 2, 1, 0, Math.PI * 2);
    ctx.fill();
  }

  for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
    if (board[r][c]) drawCell(ctx, c, r, board[r][c]);
  }
  if (flashRows.length) {
    ctx.fillStyle = 'rgba(255,220,240,0.85)';
    flashRows.forEach(function(r) { ctx.fillRect(0, r * CELL, COLS * CELL, CELL); });
  }
  if (!currentPiece || animating) return;

  // Ghost (more visible: colored fill + dashed border)
  var ghostY = getGhostY();
  currentPiece.matrix.forEach(function(row, r) {
    row.forEach(function(val, c) {
      if (val && ghostY + r >= 0) {
        var px = (currentPiece.x + c) * CELL, py = (ghostY + r) * CELL;
        var base = COLORS[val];
        var rad = Math.floor(CELL * 0.18);
        ctx.fillStyle = hexToRgba(base, 0.25);
        roundRect(ctx, px + 2, py + 2, CELL - 4, CELL - 4, rad);
        ctx.fill();
        ctx.strokeStyle = BORDERS[val];
        ctx.setLineDash([4, 3]);
        ctx.lineWidth = 2;
        ctx.strokeRect(px + 3, py + 3, CELL - 6, CELL - 6);
        ctx.setLineDash([]);
      }
    });
  });

  // Current piece
  currentPiece.matrix.forEach(function(row, r) {
    row.forEach(function(val, c) {
      if (val && currentPiece.y + r >= 0) {
        drawCell(ctx, currentPiece.x + c, currentPiece.y + r, val);
      }
    });
  });
}

function drawMiniPiece(context, piece, canvasEl) {
  var cw = canvasEl.width, ch = canvasEl.height;
  context.clearRect(0, 0, cw, ch);
  context.fillStyle = '#fff7ef';
  context.fillRect(0, 0, cw, ch);
  if (!piece) return;
  var m = PIECES[piece.id];
  var rows = m.length, cols = m[0].length;
  var cs = Math.min(Math.floor(cw / cols), Math.floor(ch / rows)) - 2;
  var ox = Math.floor((cw - cols * cs) / 2);
  var oy = Math.floor((ch - rows * cs) / 2);
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
    if (m[r][c]) {
      var base = COLORS[m[r][c]];
      var bd = BORDERS[m[r][c]];
      var px = ox + c * cs, py = oy + r * cs;
      var bw = Math.max(1, Math.floor(cs * 0.14));
      var radius = Math.floor(cs * 0.2);
      context.fillStyle = bd;
      roundRect(context, px, py, cs, cs, radius);
      context.fill();
      context.fillStyle = base;
      roundRect(context, px + bw, py + bw, cs - bw * 2, cs - bw * 2, Math.max(1, radius - bw / 2));
      context.fill();
      if (cs >= 12) {
        context.font = '900 ' + Math.floor(cs * 0.55) + 'px sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(ICONS[m[r][c]], px + cs / 2, py + cs / 2 + 1);
      }
    }
  }
}

function draw() {
  drawGrid();
  drawMiniPiece(nextCtx,  getNextPiece(0), nextCanvas);
  drawMiniPiece(nextCtx2, getNextPiece(1), nextCanvas2);
  drawMiniPiece(nextCtx3, getNextPiece(2), nextCanvas3);
  drawMiniPiece(holdCtx,  holdPiece, holdCanvas);
}

// ===== GAME LOOP =====
function gameLoop(time) {
  if (gameOver || victoryTriggered) return;
  if (paused) { requestAnimationFrame(gameLoop); return; }
  var delta = time - lastTime;
  lastTime = time;
  if (!animating && !dialogueActive) {
    dropCounter += delta;
    if (dropCounter > dropInterval) {
      dropCounter = 0;
      if (isValid(currentPiece, board, 0, 1)) {
        currentPiece.y++;
      } else {
        placePiece();
        clearLines();
        if (!gameOver && !victoryTriggered) spawnPiece();
      }
    }
  }
  if (MODE === 'story') bossTick(delta);
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== INPUT HANDLING =====
function handleAction(action) {
  if (qteActive) { qteInput(action); return; } // QTE中は全入力をコマンド判定へ
  if (gameOver || paused || animating || !gameStarted || victoryTriggered || dialogueActive) return;
  resetIdle();
  switch (action) {
    case 'left':
      if (isValid(currentPiece, board, -1, 0)) currentPiece.x--;
      break;
    case 'right':
      if (isValid(currentPiece, board, 1, 0)) currentPiece.x++;
      break;
    case 'down':
      if (isValid(currentPiece, board, 0, 1)) { currentPiece.y++; score += 1; updateScoreUI('score'); }
      break;
    case 'rotate':
      var rotated = rotate(currentPiece.matrix);
      if (isValid(currentPiece, board, 0, 0, rotated)) {
        currentPiece.matrix = rotated;
      } else if (isValid(currentPiece, board, 1, 0, rotated)) {
        currentPiece.x++; currentPiece.matrix = rotated;
      } else if (isValid(currentPiece, board, -1, 0, rotated)) {
        currentPiece.x--; currentPiece.matrix = rotated;
      } else if (isValid(currentPiece, board, 2, 0, rotated)) {
        currentPiece.x += 2; currentPiece.matrix = rotated;
      } else if (isValid(currentPiece, board, -2, 0, rotated)) {
        currentPiece.x -= 2; currentPiece.matrix = rotated;
      }
      break;
    case 'drop':
      while (isValid(currentPiece, board, 0, 1)) { currentPiece.y++; score += 2; }
      updateScoreUI('score');
      placePiece();
      clearLines();
      if (!gameOver && !victoryTriggered) spawnPiece();
      dropCounter = 0;
      break;
    case 'hold':
      holdCurrentPiece();
      break;
    case 'hissatsu':
      activateHissatsu();
      break;
  }
}

// Keyboard
document.addEventListener('keydown', function(e) {
  if (!gameStarted) return;
  if (e.key === 'p' || e.key === 'P') { paused = !paused; return; }
  var keyMap = {
    'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowDown': 'down',
    'ArrowUp': 'rotate', ' ': 'drop', 'c': 'hold', 'C': 'hold',
    'z': 'hissatsu', 'Z': 'hissatsu'
  };
  if (keyMap[e.key]) {
    e.preventDefault();
    handleAction(keyMap[e.key]);

});

// Touch / Mouse / Click controls - unified with debounce to avoid double-fire
var touchControls = document.getElementById('touch-controls');
var touchRepeatInterval = null;
var touchRepeatAction = null;
var lastActionAt = 0;
var lastActionName = '';

function runAction(action) {
  if (typeof qteActive !== 'undefined' && qteActive) {
    // QTE中：同一タップの二重発火（pointerdown+touchstartが数ms差で来る）だけ弾く。人間の連打(100ms超)は通す
    var qnow = Date.now();
    if (action === lastActionName && qnow - lastActionAt < 60) return;
    lastActionAt = qnow;
    lastActionName = action;
    handleAction(action);
    return;
  }
  // 同一タップの二重発火（pointerdown+touchstart+click）だけを弾く。人間の連打（100ms超）は通す
  var now = Date.now();
  if (action === lastActionName && now - lastActionAt < 80) return;
  lastActionAt = now;
  lastActionName = action;
  handleAction(action);
}

var touchRepeatDelay = null;
function startRepeat(action) {
  if (typeof qteActive !== 'undefined' && qteActive) return; // QTE中は長押し連打を発生させない
  if (action !== 'left' && action !== 'right' && action !== 'down') return;
  stopRepeat();
  touchRepeatAction = action;
  // ちょん押し＝1マスだけ。260ms以上の長押しで初めて連続移動が始まる（DAS方式）
  touchRepeatDelay = setTimeout(function() {
    touchRepeatInterval = setInterval(function() {
      // Bypass debounce for repeat
      handleAction(touchRepeatAction);
    }, 70);
  }, 240);
}
function stopRepeat() {
  clearTimeout(touchRepeatDelay);
  clearInterval(touchRepeatInterval);
  touchRepeatAction = null;
}

// Pointerdown covers both mouse and touch in modern browsers
touchControls.addEventListener('pointerdown', function(e) {
  var btn = e.target.closest('.touch-btn');
  if (!btn) return;
  e.preventDefault();
  var action = btn.dataset.action;
  runAction(action);
  startRepeat(action);
});
touchControls.addEventListener('pointerup', stopRepeat);
touchControls.addEventListener('pointercancel', stopRepeat);
touchControls.addEventListener('pointerleave', stopRepeat);

// Click fallback for older browsers / accessibility / synthetic taps
touchControls.addEventListener('click', function(e) {
  var btn = e.target.closest('.touch-btn');
  if (!btn) return;
  runAction(btn.dataset.action);
});

// Extra safety: touchstart for iOS Safari (covered by pointerdown on modern iOS but harmless)
touchControls.addEventListener('touchstart', function(e) {
  var btn = e.target.closest('.touch-btn');
  if (!btn) return;
  e.preventDefault();
  var action = btn.dataset.action;
  runAction(action);
  startRepeat(action);
}, { passive: false });
touchControls.addEventListener('touchend', function(e) { e.preventDefault(); stopRepeat(); }, { passive: false });
touchControls.addEventListener('touchcancel', stopRepeat, { passive: false });

// Prevent scrolling/zooming
document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
document.addEventListener('gesturechange', function(e) { e.preventDefault(); });

var storyBgmEl = null, storyBgmName = null;
function storyVol() { return bgmLevel === 0 ? 0 : (bgmLevel === 1 ? 0.35 : 0.65); }
function playStoryBgm(name, loop, onend) {
  if (storyBgmName === name && storyBgmEl && !storyBgmEl.paused) { storyBgmEl.loop = !!loop; return; }
  stopStoryBgm();
  var a = new Audio('assets/story/bgm/' + name + '.mp3');
  a.loop = !!loop;
  a.volume = storyVol();
  if (onend) a.onended = onend;
  a.play().catch(function(){});
  storyBgmEl = a;
  storyBgmName = name;
}
function stopStoryBgm() {
  if (storyBgmEl) {
    storyBgmEl.onended = null;
    storyBgmEl.pause();
    storyBgmEl = null;
    storyBgmName = null;
  }
}
function playStoryBgmForPhase() {
  var t = 'bgm_play';
  if (storyPhase === 'boss1') t = 'bgm_boss1';
  else if (storyPhase === 'boss2') t = 'bgm_boss2';
  // とどめ：絶望フェーズは重厚な曲、「4列だ!」と分かった反撃フェーズはパンクロック
  else if (storyPhase === 'finisher') t = (finisherRevealed && isPureRun()) ? 'bgm_rock' : 'bgm_finisher';
  playStoryBgm(t, true);
}

// --- 汎用：カード表示（暗転フルスクリーン、タップで進む）---
var cardState = null;
function showCards(cards, done) {
  cardState = { cards: cards, idx: 0, done: done };
  dialogueActive = true;
  document.getElementById('card-layer').classList.remove('gone');
  renderCard();
}
function renderCard() {
  var c = cardState.cards[cardState.idx];
  var txt = document.getElementById('card-text');
  var art = document.getElementById('card-art');
  var img = document.getElementById('card-img');
  txt.textContent = c.text || '';
  txt.className = c.big ? 'big' : (c.small ? 'small' : '');
  if (c.img) {
    img.src = ART + c.img;
    img.classList.remove('gone');
  } else {
    img.classList.add('gone');
  }
  if (c.art) {
    art.textContent = c.art;
    art.classList.remove('gone');
  } else {
    art.classList.add('gone');
  }
  // 真エンディング：店主の後ろ姿（写真が無ければ湯気だけの暗転演出になる）
  var master = document.getElementById('card-master');
  var layer = document.getElementById('card-layer');
  if (c.master) {
    master.src = ART + (c.master === 'thumb' ? 'master_thumbsup.jpg' : 'master_back.jpg');
    master.style.display = '';
    master.classList.remove('gone');
    layer.classList.add('true-end');
  } else {
    master.classList.add('gone');
    layer.classList.remove('true-end');
  }
  if (c.se === 'clink') sfxClink();
}
function advanceCard() {
  if (!cardState) return;
  cardState.idx++;
  if (cardState.idx >= cardState.cards.length) {
    document.getElementById('card-layer').classList.add('gone');
    var d = cardState.done;
    cardState = null;
    dialogueActive = false;
    if (d) d();
  } else {
    renderCard();
  }
}

// --- 汎用：会話表示 ---
var dlgState = null;
function showDialogue(seq, done) {
  dlgState = { seq: seq, idx: 0, done: done };
  dialogueActive = true;
  document.getElementById('dialogue-layer').classList.remove('gone');
  renderDlg();
}
function renderDlg() {
  var line = dlgState.seq[dlgState.idx];
  var nameEl = document.getElementById('dlg-name');
  var textEl = document.getElementById('dlg-text');
  var port = document.getElementById('dlg-portrait');
  var cg = document.getElementById('dlg-cg');
  if (line.img) {
    cg.src = ART + line.img;
    cg.classList.remove('gone');
  } else {
    cg.classList.add('gone');
  }
  textEl.textContent = line.text;
  if (line.sp) {
    nameEl.textContent = line.sp;
    nameEl.style.display = '';
    port.style.display = '';
    setPortrait(port, line.sp);
    textEl.classList.remove('narration');
  } else {
    nameEl.style.display = 'none';
    port.style.display = 'none';
    textEl.classList.add('narration');
  }
}
function setPortrait(el, sp) {
  if (sp === 'けん') { el.innerHTML = '<img src="' + DOG_IMG + '" alt="けん">'; el.style.background = '#fff'; }
  else if (sp === '黒丼の男') { el.innerHTML = '<img src="' + ART + 'portrait_kurodon.jpg" alt="黒丼の男">'; el.style.background = '#1a1016'; }
  else if (sp === '父') { el.innerHTML = '<img src="' + ART + 'portrait_father.jpg" alt="父">'; el.style.background = '#6d4c41'; }
  else if (sp === '即席大魔王') { el.innerHTML = '<img src="' + ART + 'portrait_maou.jpg" alt="即席大魔王">'; el.style.background = '#4a148c'; }
  else { el.textContent = '?'; el.style.background = '#999'; }
}
function advanceDlg() {
  if (!dlgState) return;
  dlgState.idx++;
  if (dlgState.idx >= dlgState.seq.length) endDlg();
  else renderDlg();
}
function endDlg() {
  if (!dlgState) return;
  document.getElementById('dialogue-layer').classList.add('gone');
  var d = dlgState.done;
  dlgState = null;
  dialogueActive = false;
  if (d) d();
}

// タップ・キーで読み進める

  e.stopPropagation();
  e.preventDefault();
  endDlg();
});
document.getElementById('card-layer').addEventListener('pointerdown', function(e) {
  e.preventDefault();
  advanceCard();
});
document.addEventListener('keydown', function(e) {
  if (dlgState || cardState) {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') {
      e.preventDefault();
      if (dlgState) advanceDlg(); else advanceCard();
    }
  }
});

           punchMs:d.punchMs, twoRowChance:d.twoRowChance, quotes:d.quotes,
           timer:0, winding:false };

  if (d.faceImg) faceEl.innerHTML = '<img src="' + ART + d.faceImg + '" alt="' + boss.name + '">';

function throwProjectile(emoji, dir, onHit) {

  var startX = fr.left - sr.left + fr.width / 2 - 17;
  var endX = tr.left - sr.left + tr.width / 2 - 17;

  p.style.transition = 'left 0.35s ease-in, top 0.35s ease-in, transform 0.35s ease-in';
  p.style.left = endX + 'px';

function floatAt(targetEl, text, extraClass) {

// FF風の近接攻撃：相手のところまで突進→接触した瞬間に打撃→戻る
function dashAttack(attacker, target, emoji, onHit) {
  var a = attacker.getBoundingClientRect();
  var t = target.getBoundingClientRect();
  // 縦並び・横並びどちらでも成立するよう、中心どうしを結ぶ向きに突進する
  var vx = (t.left + t.width / 2) - (a.left + a.width / 2);
  var vy = (t.top + t.height / 2) - (a.top + a.height / 2);
  var dist = Math.sqrt(vx * vx + vy * vy) || 1;
  var stop = Math.max(0, dist - (a.height + t.height) * 0.34); // 相手の手前で止める
  var dx = vx / dist * stop, dy = vy / dist * stop;
  attacker.style.transition = 'transform 0.22s cubic-bezier(0.35,0,0.7,1)';
  attacker.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  attacker.style.zIndex = 8;
  setTimeout(function() {
    // 接触！打撃エフェクトを相手の位置に出す
    var stage = document.getElementById('battle-stage');
    var sr = stage.getBoundingClientRect();
    var burst = document.createElement('div');
    burst.className = 'impact-burst';
    burst.textContent = emoji;
    burst.style.left = (t.left - sr.left + t.width / 2 - 18) + 'px';
    burst.style.top = (t.top - sr.top + t.height / 2) + 'px';
    stage.appendChild(burst);
    setTimeout(function() { burst.remove(); }, 400);
    if (onHit) onHit();
    attacker.style.transform = '';
    setTimeout(function() {
      attacker.style.transition = '';
      attacker.style.zIndex = '';
    }, 260);
  }, 230);
}

// ぷよぷよの「おじゃまぷよ」方式：お邪魔ブロックがランダムな列にパラパラ降り積もる
function addOjamaBlocks(count) {
  var placed = 0;
  var iv = setInterval(function() {
    if (gameOver || !gameStarted) { clearInterval(iv); return; }
    // 空きのある列をランダムに探す
    var c = -1;
    for (var tries = 0; tries < 20; tries++) {
      var cand = Math.floor(Math.random() * COLS);
      if (!board[0][cand]) { c = cand; break; }
    }
    if (c < 0) { clearInterval(iv); endGame(); return; }
    // その列の一番上に着地させる
    var r = 0;
    while (r + 1 < ROWS && !board[r + 1][c]) r++;
    if (!board[r][c]) board[r][c] = 9;
    // 落下中のピースと重なったら押し上げる
    if (currentPiece) {
      var guard = 0;
      while (!isValid(currentPiece, board) && guard < 4) { currentPiece.y--; guard++; }
      if (!isValid(currentPiece, board)) { clearInterval(iv); endGame(); return; }
    }
    placed++;
    if (placed >= count) {
      clearInterval(iv);
      updatePinchState();
    }
  }, 70);
}

function addGarbageRows(n) {
  for (var i = 0; i < n; i++) {
    if (board[0].some(function(c) { return c !== 0; })) { endGame(); return; }
    board.shift();
    var row = Array(COLS).fill(9);
    row[Math.floor(Math.random() * COLS)] = 0; // 穴を1マス（消せる段にするための標準仕様）
    board.push(row);
  }
  if (currentPiece) {
    var guard = 0;
    while (!isValid(currentPiece, board) && guard < 4) { currentPiece.y--; guard++; }
    if (!isValid(currentPiece, board)) { endGame(); return; }
  }
  updatePinchState();
}

var qteActive = false;
var qteSeq = [];
var qteIdx = 0;
// 発動のたびにコマンドをランダム生成（8入力・同じキーの3連続は出さない）
function genQteSeq() {
  var pool = ['left', 'right', 'down', 'rotate'];
  var seq = [];
  while (seq.length < 8) {
    var a = pool[Math.floor(Math.random() * pool.length)];
    if (seq.length >= 2 && seq[seq.length - 1] === a && seq[seq.length - 2] === a) continue;
    seq.push(a);
  }
  return seq;
}
var qteTimerHandle = null;
var QTE_ICONS = { left:'←', right:'→', down:'↓', rotate:'↻' };
var QTE_TIME_MS = 8000; // 8入力を8秒で（ゲージが空になる前に打ち切る）

function startQTE() {
  stopRepeat(); // 直前の長押し（↓連打など）が残っていたら殺す
  qteActive = true;
  qteIdx = 0;
  qteFailCount = 0;
  qteSeq = genQteSeq(); // 毎回ちがうコマンド（リトライ中は同じまま）
  document.getElementById('qte-layer').classList.remove('gone');
  renderQTE();
  startQTETimer();
  sfxKyuin();

}
function renderQTE() {
  var seqEl = document.getElementById('qte-seq');

  for (var i = 0; i < qteSeq.length; i++) {
    var s = document.createElement('div');
    s.className = 'qte-icon' + (i < qteIdx ? ' done' : (i === qteIdx ? ' cur' : ''));
    s.textContent = QTE_ICONS[qteSeq[i]];

}
var qteTimerTick = null;
function startQTETimer() {
  var bar = document.getElementById('qte-timer');

  // タイマー駆動で確実にゲージを減らす（50msごと更新＝見た目なめらか）
  var t0 = Date.now();
  bar.style.width = '100%';
  qteTimerTick = setInterval(function() {
    var remain = Math.max(0, 1 - (Date.now() - t0) / QTE_TIME_MS);
    bar.style.width = (remain * 100) + '%';
    if (remain <= 0 || !qteActive) clearInterval(qteTimerTick);
  }, 50);
  // 時間切れだけが仕切り直し条件（もう一度4列から）
  qteTimerHandle = setTimeout(qteAbort, QTE_TIME_MS);
}
function qteInput(action) {

    qteIdx++;

// 1入力ごとに音階が駆け上がる「キュイン♪」（ドレミファソラシド）
var QTE_SCALE = [523.25, 587.33, 659.25, 698.46, 783.99, 880, 987.77, 1046.5];
var qtePingVer = 'new'; // 'new'=ドレミ階段 / 'old'=キュイン上昇（聴き比べ用）
function sfxQtePingOld(step) {
  var ac = getAudioCtx(); var t = ac.currentTime;
  var base = 500 + step * 130;
  // メイン（キュイン上昇）
  var osc = ac.createOscillator(); var g = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(base, t);
  osc.frequency.exponentialRampToValueAtTime(base * 1.7, t + 0.1);
  g.gain.setValueAtTime(0.26, t);
  g.gain.linearRampToValueAtTime(0, t + 0.18);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t); osc.stop(t + 0.19);
  // 上のオクターブのきらめき
  var osc2 = ac.createOscillator(); var g2 = ac.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(base * 2, t + 0.02);
  g2.gain.setValueAtTime(0.14, t + 0.02);
  g2.gain.linearRampToValueAtTime(0, t + 0.16);
  osc2.connect(g2); g2.connect(sfxGain);
  osc2.start(t + 0.02); osc2.stop(t + 0.17);
}
function sfxQtePing(step) {
  if (qtePingVer === 'old') return sfxQtePingOld(step);
  var ac = getAudioCtx(); var t = ac.currentTime;
  var base = QTE_SCALE[Math.min(step - 1, QTE_SCALE.length - 1)];
  var osc = ac.createOscillator(); var g = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(base, t);
  osc.frequency.exponentialRampToValueAtTime(base * 1.5, t + 0.08);
  g.gain.setValueAtTime(0.26, t);
  g.gain.linearRampToValueAtTime(0, t + 0.18);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t); osc.stop(t + 0.19);
  // 下のオクターブで太く
  var osc2 = ac.createOscillator(); var g2 = ac.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(base / 2, t);
  g2.gain.setValueAtTime(0.16, t);
  g2.gain.linearRampToValueAtTime(0, t + 0.15);
  osc2.connect(g2); g2.connect(sfxGain);
  osc2.start(t); osc2.stop(t + 0.16);
  // 上のオクターブできらめき
  var osc3 = ac.createOscillator(); var g3 = ac.createGain();
  osc3.type = 'sine';
  osc3.frequency.setValueAtTime(base * 2, t + 0.02);
  g3.gain.setValueAtTime(0.12, t + 0.02);
  g3.gain.linearRampToValueAtTime(0, t + 0.14);
  osc3.connect(g3); g3.connect(sfxGain);
  osc3.start(t + 0.02); osc3.stop(t + 0.15);
}
// 全部成功「キュリリリン!!」→ 大当たりファンファーレ（三段重ね）
function sfxQteComplete() {
  var ac = getAudioCtx(); var t = ac.currentTime;
  // 第1段: 超高速の駆け上がり
  var run = [523, 659, 784, 1046, 1318, 1568, 2093, 2637];
  run.forEach(function(f, i) {
    var osc = ac.createOscillator(); var g = ac.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(f, t + i * 0.045);
    g.gain.setValueAtTime(0.24, t + i * 0.045);
    g.gain.linearRampToValueAtTime(0, t + i * 0.045 + 0.11);
    osc.connect(g); g.connect(sfxGain);
    osc.start(t + i * 0.045); osc.stop(t + i * 0.045 + 0.12);
  });
  // 第2段: 決めの和音（ド・ミ・ソ・ド）をビブラート付きロングトーンでドーン
  var chordT = t + 0.42;
  [523.25, 659.25, 783.99, 1046.5].forEach(function(f) {
    var osc = ac.createOscillator(); var g = ac.createGain();
    var lfo = ac.createOscillator(); var lfoG = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(f, chordT);
    lfo.frequency.setValueAtTime(6, chordT);
    lfoG.gain.setValueAtTime(5, chordT);
    lfo.connect(lfoG); lfoG.connect(osc.frequency);
    g.gain.setValueAtTime(0.16, chordT);
    g.gain.setValueAtTime(0.16, chordT + 0.35);
    g.gain.linearRampToValueAtTime(0, chordT + 0.85);
    osc.connect(g); g.connect(sfxGain);
    lfo.start(chordT); osc.start(chordT);
    lfo.stop(chordT + 0.9); osc.stop(chordT + 0.9);
  });
  // 第3段: 高域のキラキラを散らす
  for (var k = 0; k < 7; k++) {
    (function(k) {
      var st = chordT + 0.1 + k * 0.07;
      var osc = ac.createOscillator(); var g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2000 + (k % 3) * 700 + k * 120, st);
      g.gain.setValueAtTime(0.1, st);
      g.gain.linearRampToValueAtTime(0, st + 0.18);
      osc.connect(g); g.connect(sfxGain);
      osc.start(st); osc.stop(st + 0.19);
    })(k);
  }
}
function sfxQteFail() {
  var ac = getAudioCtx(); var t = ac.currentTime;
  var osc = ac.createOscillator(); var g = ac.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(160, t);
  osc.frequency.linearRampToValueAtTime(80, t + 0.25);
  g.gain.setValueAtTime(0.22, t);
  g.gain.linearRampToValueAtTime(0, t + 0.28);
  osc.connect(g); g.connect(sfxGain);
  osc.start(t); osc.stop(t + 0.3);
}
